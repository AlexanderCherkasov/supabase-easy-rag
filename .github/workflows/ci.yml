name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Postgres Integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Prepare Standalone Environment & Apply Standard Supabase Migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d postgres -f sql/local_init/00_init_supabase_shim.sql
          psql -h localhost -p 5432 -U postgres -d postgres -f sql/01_schema.sql
          psql -h localhost -p 5432 -U postgres -d postgres -f sql/02_functions.sql

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Test Suite (Offline Unit + Adversarial RLS + Filtered ANN + Real Postgres Integration)
        env:
          CI: "true"
          POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/postgres"
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-service-key"
          SUPABASE_ANON_KEY: "dummy-anon-key"
          OPENAI_API_KEY: "sk-dummy-key"
          LLM_API_KEY: "sk-dummy-key"
          EMBEDDING_API_KEY: "sk-dummy-key"
        run: |
          python -m unittest discover tests -v

      - name: Run Retrieval Ablation Study (Vector vs FTS vs Hybrid RRF)
        run: |
          python eval/ablation_study.py
