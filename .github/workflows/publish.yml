name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repository_url:
        description: "Target repository (leave empty for PyPI, or 'https://test.pypi.org/legacy/' for TestPyPI)"
        required: false
        default: ""

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata with twine
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts
          path: dist/
          retention-days: 7

  publish:
    name: Publish to PyPI 🚀
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/supabase-easy-rag

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-artifacts
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository_url || '' }}
          # If using static token instead of OIDC trusted publishing, secret can be passed:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          print-hash: true
