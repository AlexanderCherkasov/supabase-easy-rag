services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: easy_rag_test_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./sql/local_init/00_init_supabase_shim.sql:/docker-entrypoint-initdb.d/00_init_supabase_shim.sql:ro
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_functions.sql:/docker-entrypoint-initdb.d/02_functions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
