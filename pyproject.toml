[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supabase-easy-rag"
version = "0.4.0"
description = "Production-ready, lightweight Hybrid RAG (Vector + Full-Text Search + Facets) engine for Supabase."

readme = "README.md"
authors = [
    { name = "Alexander Cherkasov" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["supabase", "rag", "vector", "pgvector", "hybrid-search", "embeddings", "postgrest", "mlx"]
requires-python = ">=3.10"
dependencies = [
    "postgrest>=0.10.0,<1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
azure = ["openai>=1.0.0"]
async = ["httpx>=0.24.0"]
mlx = [
    "mlx>=0.16.0; sys_platform == 'darwin'",
    "mlx-lm>=0.18.0; sys_platform == 'darwin'",
    "transformers>=4.40.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
easy-rag = "supabase_easy_rag.cli:app"
supabase-easy-rag = "supabase_easy_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["supabase_easy_rag"]

[tool.hatch.build.targets.wheel.force-include]
"supabase_easy_rag/py.typed" = "supabase_easy_rag/py.typed"
"sql" = "supabase_easy_rag/sql"

